name: Dependencies

# Versions here are pinned exactly, so nothing updates on its own and the tree
# drifts quietly until something needs a security fix in a hurry. This raises
# the patch and minor bumps once a month, proves them against the repo's own
# verify, and opens a PR for the ones that pass.
#
# Split the same way as the PageSpeed routine: the script does what is
# decidable — read pnpm outdated, classify by semver, write the manifest — and
# Claude does the part that needs judgement, which is what to do when the
# build breaks and how to say so.
on:
  schedule:
    # 07:00 UTC on the 2nd, an hour after the PageSpeed routine and a day
    # clear of it, so two PRs never arrive in the same breath.
    - cron: '0 7 2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: dependencies
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Writes package.json, installs, and leaves dependencies.json describing
      # what it raised and what it held back.
      - name: Bump
        run: node src/scripts/dependencies.ts

      # Named here rather than by the model, so the guard below knows exactly
      # which branch to inspect.
      - name: Name the branch
        id: branch
        run: echo "name=chore/dependencies-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution":{"commit":"","pr":""}}'
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Edit,Bash(git:*),Bash(pnpm:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr edit:*)"
          # The rules live in .github/prompts/dependencies.md, so this run and
          # the eval suite that scores the same judgement read one file. The
          # branch name stays here because it is a workflow expression, and a
          # markdown file cannot interpolate one.
          prompt: |
            Read .github/prompts/dependencies.md and follow it exactly. It
            holds the whole task: what to run, what to do when verify fails,
            what you may and may not edit, and what the PR has to say.

            The branch name you were given, and the one the check after this
            step inspects, is: ${{ steps.branch.outputs.name }}

            If that file is missing or unreadable, stop and say so. Do not
            infer the rules from this prompt.

      # The prompt says this run may change only package.json and the lockfile.
      # That is a request to a model; this makes it a rule. If the branch it
      # pushed touches anything else, the PR is closed, the branch deleted, and
      # the run fails so the failure email says why.
      #
      # It runs after the PR exists rather than before, because the PR has to be
      # opened by the Claude GitHub App: a PR opened with the workflow's own
      # token does not trigger CI, and an unproven PR is worse than a closed one.
      # always(), so a model step that failed after pushing is still checked.
      - name: Guard the diff
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          if ! git fetch --quiet --depth=50 origin main "$BRANCH" 2>/dev/null; then
            echo "No branch pushed this month, so nothing to guard."
            exit 0
          fi

          outside=$(git diff --name-only "origin/main" "origin/$BRANCH" |
            grep -vxE 'package\.json|pnpm-lock\.yaml' || true)

          # package.json is allowed, and it defines what `verify` means. A run
          # that dropped `pnpm coverage` from that script, or appended
          # `|| true`, would weaken every check in the repo while touching only
          # a permitted file - which the path check above cannot see. Writing an
          # eval case for the model refusing to do this is what turned the hole
          # up; a check is better than a case, because it does not have to be
          # believed.
          scripts=''
          if ! diff -q \
            <(git show "origin/main:package.json" | jq -S '.scripts') \
            <(git show "origin/$BRANCH:package.json" | jq -S '.scripts') \
            >/dev/null 2>&1; then
            scripts=$(diff \
              <(git show "origin/main:package.json" | jq -S '.scripts') \
              <(git show "origin/$BRANCH:package.json" | jq -S '.scripts') || true)
          fi

          if [ -z "$outside" ] && [ -z "$scripts" ]; then
            echo "Only dependency entries in package.json and pnpm-lock.yaml changed."
            exit 0
          fi

          reason=''

          if [ -n "$outside" ]; then
            echo "::error::The dependency run changed files it may not touch:"
            echo "$outside"
            reason="it also changed files it may not touch:

          $(printf '%s\n' "$outside" | sed 's/^/- /')"
          fi

          if [ -n "$scripts" ]; then
            echo "::error::The dependency run changed package.json's scripts:"
            echo "$scripts"
            reason="$reason${reason:+

          }it changed the scripts in package.json, which is where the checks are defined:

          \`\`\`diff
          $scripts
          \`\`\`"
          fi

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "Closed by the diff guard. The monthly run may change dependency entries in package.json and pnpm-lock.yaml, and nothing else - $reason

          A dependency that needs code changes belongs in dependencyMajor.yml, where a person asks for it by name. A dependency that only passes once a check is weakened belongs nowhere."
          else
            git push --quiet origin --delete "$BRANCH"
          fi

          exit 1
