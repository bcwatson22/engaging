name: Evals

# Scores the PageSpeed judgement against fixed reports. Dispatch only, and
# never a gate on a commit: every case spends real tokens and the answers are
# not deterministic, so a red run here means "read it", not "you broke it".
#
# The deterministic half of the suite does gate. `pnpm check:evals` is in
# verify, and it fails if a generated prompt no longer matches the rules file
# it was built from - no model, no cost, no flake.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: >-
          Runs per case. Three is the default and enough to see a case that
          only passes sometimes, which is the thing worth knowing.
        required: false
        default: '3'
        type: string
      case:
        description: >-
          Glob to run one case instead of all of them, e.g. leaving-100*.
          Empty runs the suite.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The suite needs none of the project's dependencies: the prompts are
      # markdown and the builder is TypeScript run straight by Node. Only the
      # CLI that scores them has to be installed, and it is not the one the
      # other workflows use - they call claude-code-action, which runs a
      # prompt, while this runs a command.
      - name: Install the CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Check the prompts match the rules
        run: node evals/pagespeed/build.ts --check

      # --threshold 1 fails the run if any case scores below full marks, which
      # is the right bar while every case is a verdict with one correct answer.
      # --max-cost-usd is a stop, not a budget: five cases at three runs costs
      # about $1.50, so $5 only catches something going wrong.
      # Deliberately does not fail here. The CLI's exit code alone cannot tell
      # a run that scored badly from one that never got to score, so it is
      # handed to the next step, which can look at the result and say which.
      - name: Score the suite
        id: score
        env:
          # The same token the other workflows hand to claude-code-action. The
          # CLI reads it straight from the environment.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude plugin eval . \
            --eval-dir evals \
            --runs "${{ inputs.runs }}" \
            ${{ inputs.case && format('--case {0}', inputs.case) || '' }} \
            --ablation none \
            --threshold 1 \
            --max-cost-usd 8 \
            --no-publish \
            --trust-plugin \
            --report "$RUNNER_TEMP/report.html" \
            --json "$RUNNER_TEMP/result.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # The scores and a verdict, in the run summary, whether or not the run
      # passed - and this step's exit code is what fails the job. The first CI
      # run of the full suite scored nine cases of twelve and stopped, and the
      # summary said nothing about the three that never ran: the only honest
      # reading of it was "something happened". evals/summarise.ts tells the
      # three cases apart - blocked, stopped early, or scored and failed - and
      # it is tested against the real result files of each.
      - name: Publish the scores
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/result.json" ]; then
            node evals/summarise.ts "$RUNNER_TEMP/result.json" \
              "${{ steps.score.outputs.code || 1 }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## The run failed before writing a result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Read the job log. This is a fault in the workflow or the" >> "$GITHUB_STEP_SUMMARY"
            echo "credential, not a finding about the suite." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: ${{ runner.temp }}/report.html
          retention-days: 90
          if-no-files-found: ignore
