name: PageSpeed

# The README quotes Lighthouse scores with a date against them, and a quoted
# number ages quietly: nothing breaks, it just stops being true. This measures
# the live site monthly and opens a PR when the figures have actually moved.
#
# The split is deliberate. The script measures and takes the median of three
# runs per page, because that is arithmetic and a model is the wrong tool for
# arithmetic you cannot check. Claude reads the result and decides whether a
# change is real or run-to-run noise, then writes the prose — which is the part
# no script does well.
on:
  schedule:
    # 06:00 UTC on the 1st. Monthly, because the site changes in bursts and a
    # weekly PR nobody reads is how a routine becomes noise.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Never two at once: both would branch from the same main and open competing
# PRs against the same table.
concurrency:
  group: pageSpeed
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Tracks .nvmrc, like CI. The script is TypeScript run directly by
          # Node, so nothing is installed or built.
          node-version-file: .nvmrc

      # Sixteen PageSpeed calls, one at a time: four pairs of page and
      # strategy, each a discarded warm-up plus the three that count. Five
      # minutes or so.
      - name: Measure
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node src/scripts/pageSpeed.ts

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same as the repo's own settings: no attribution trailers on the
          # commit or the PR body. The action does not add them today; this
          # makes that a setting rather than something the prompt has to keep
          # asking for.
          settings: '{"attribution":{"commit":"","pr":""}}'
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Edit,Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr edit:*)"
          # The rules live in .github/prompts/pageSpeed.md, so this run and the
          # eval suite that tests the same judgement read one file. A copy here
          # would drift from the copy the suite exercises, and a suite passing
          # against a stale duplicate is worse than no suite.
          prompt: |
            Read .github/prompts/pageSpeed.md and follow it exactly. It holds
            the whole task: what to compare, which changes count as noise,
            which count as real, and what to do in either case.

            If that file is missing or unreadable, stop and say so. Do not
            infer the rules from this prompt or from the README.
