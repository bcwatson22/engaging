name: Dependency major

# The monthly routine never applies a major: a major is a promise the author
# has broken something, and an unattended agent should not be deciding what to
# do about that. This is the other half — you pick the upgrade, and Claude does
# the work with you reviewing.
#
# Unlike the monthly run, this one may change application code, because that is
# what a major usually needs. It still cannot merge, and its PR is the review.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to take to their latest major, comma separated. A major
          rarely arrives alone — vitest and its coverage providers have to move
          together, as do react and react-dom.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: dependency-major-${{ inputs.packages }}
  cancel-in-progress: false

jobs:
  major:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution":{"commit":"","pr":""}}'
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(pnpm:*),Bash(node:*),Bash(npm view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr edit:*),WebFetch"
          # The rules live in .github/prompts/dependencyMajor.md, so this run
          # and the eval suite that scores the same judgement read one file.
          # The packages and the report path stay here: one is a workflow
          # input and the other a runner variable, and a markdown file can
          # interpolate neither.
          prompt: |
            Read .github/prompts/dependencyMajor.md and follow it exactly. It
            holds the whole task: what to read before changing anything, what
            you may and may not do to reach green, what the PR has to say, and
            what to do when the upgrade cannot be made to work.

            The packages you were given, to take to their latest major
            together: ${{ inputs.packages }}

            Write your report to: $RUNNER_TEMP/report.md

            If that file is missing or unreadable, stop and say so. Do not
            infer the rules from this prompt.

      # The action hides Claude's output and its own summary comes back empty,
      # so a run that decides against opening a PR leaves no reasoning behind —
      # which is the run you most want to read. Claude writes its report to a
      # file; this puts it where a person looks.
      - name: Publish the report
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written. Read the job log, and treat a missing" >> "$GITHUB_STEP_SUMMARY"
            echo "report as a bug in this workflow rather than a quiet success." >> "$GITHUB_STEP_SUMMARY"
          fi
